<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download song UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="card">
            <p class="text">Click on the button to Download <span>Song.mp3</span> file</p>
            <div class="outer">
                <div class="inner">
                </div>
            </div>
            <div class="bottom">
                <h2 class="percentage">0%</h2>
                <div class="loader"></div>
                <button class="btn">Download</button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
